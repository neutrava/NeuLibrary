name: Build NeuLibrar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Project & Inject Icon
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-*.png www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init NeuLibrar com.neulibrar.app --web-dir www
          npx cap add android
          npx cap sync android
          # İkonu tüm Android klasörlerine doğrudan yerleştir ve yuvarlak maskeyi temizle
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon-512.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp icon-512.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp icon-512.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuLibrar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
