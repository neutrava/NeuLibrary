name: Build NeuLibrar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK & Sign
        run: |
          unzip -o "*.zip" 2>/dev/null || true
          
          mkdir -p www
          cp index.html manifest.json sw.js *.png www/ 2>/dev/null || true
          
          echo '{"name":"neulibrar","version":"1.0.0"}' > package.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init NeuLibrar com.neulibrar.app --web-dir www
          npx cap add android
          npx cap sync android
          
          if [ -f "icon-512.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp icon-512.png "$dir/ic_launcher.png" || true
                cp icon-512.png "$dir/ic_launcher_round.png" || true
                cp icon-512.png "$dir/ic_launcher_foreground.png" || true
              fi
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          # Sabit Keystore ile APK'yı İmza
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/apksigner sign --ks ../release.keystore --ks-pass pass:neulibrar123 --ks-key-alias neulibrar --key-pass pass:neulibrar123 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuLibrar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
