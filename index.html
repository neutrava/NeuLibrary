<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121316">
    <title>NeuLibrar</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #121316;
            --bg-secondary: #1a1c20;
            --bg-tertiary: #23262d;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent: #6366f1;
            --border: #2e323b;
            --status-read-bg: rgba(16, 185, 129, 0.15);
            --status-read-text: #34d399;
            --status-reading-bg: rgba(59, 130, 246, 0.15);
            --status-reading-text: #60a5fa;
            --status-reread-bg: rgba(245, 158, 11, 0.15);
            --status-reread-text: #fbbf24;
            --status-plan-bg: rgba(156, 163, 175, 0.15);
            --status-plan-text: #9ca3af;
            --danger: #ef4444;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #4f46e5;
            --border: #e2e8f0;
            --status-read-bg: #dcfce7;
            --status-read-text: #15803d;
            --status-reading-bg: #dbeafe;
            --status-reading-text: #1d4ed8;
            --status-reread-bg: #fef3c7;
            --status-reread-text: #b45309;
            --status-plan-bg: #f1f5f9;
            --status-plan-text: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.5; padding-bottom: 95px; user-select: none; }
        .container { max-width: 920px; margin: 0 auto; padding: 20px 16px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .brand h1 { font-size: 1.4rem; font-weight: 700; }
        .brand p { font-size: 0.8rem; color: var(--text-secondary); }
        .header-actions { display: flex; gap: 8px; }

        .icon-btn { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 500; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--bg-secondary); border: 1px solid var(--border); padding: 12px 8px; border-radius: 10px; text-align: center; cursor: pointer; }
        .stat-card.active { border-color: var(--accent); background: var(--bg-tertiary); }
        .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 1.35rem; font-weight: 600; display: block; }
        .stat-label { font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; display: block; }

        .search-box { margin-bottom: 12px; }
        .search-box input { width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); padding: 11px 14px; border-radius: 10px; font-size: 0.9rem; outline: none; }

        .sort-scroll-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
        .sort-chip { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary); padding: 7px 13px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; white-space: nowrap; cursor: pointer; }
        .sort-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

        .book-list { display: flex; flex-direction: column; gap: 8px; }
        .book-item { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px; cursor: pointer; }
        .book-no { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--text-muted); font-weight: 500; text-align: center; background: var(--bg-tertiary); padding: 4px 6px; border-radius: 6px; }
        .book-title { font-weight: 600; font-size: 0.96rem; color: var(--text-primary); }
        .book-author { font-size: 0.82rem; color: var(--text-secondary); margin-top: 1px; }
        .book-note { font-size: 0.78rem; color: var(--status-reread-text); margin-top: 5px; padding: 3px 8px; background: var(--status-reread-bg); border-radius: 5px; display: inline-block; }
        
        .badges-container { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
        .badge { font-size: 0.76rem; font-weight: 600; padding: 6px 11px; border-radius: 20px; white-space: nowrap; border: 1px solid transparent; }
        .badge-read { background: var(--status-read-bg); color: var(--status-read-text); border-color: rgba(52, 211, 153, 0.3); }
        .badge-reading { background: var(--status-reading-bg); color: var(--status-reading-text); border-color: rgba(96, 165, 250, 0.3); }
        .badge-reread { background: var(--status-reread-bg); color: var(--status-reread-text); border-color: rgba(251, 191, 36, 0.3); }
        .badge-plan { background: var(--status-plan-bg); color: var(--status-plan-text); border-color: rgba(156, 163, 175, 0.3); }
        .badge-count { background: rgba(99, 102, 241, 0.2); color: #818cf8; border-color: rgba(99, 102, 241, 0.4); font-size: 0.72rem; padding: 4px 8px; }

        .fab { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: #fff; border: none; border-radius: 50px; padding: 14px 22px; font-size: 0.92rem; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); z-index: 50; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 440px; padding: 22px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 1.15rem; margin-bottom: 16px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
        
        .reread-box { background: var(--bg-tertiary); border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .reread-count-text { font-size: 0.88rem; font-weight: 600; color: var(--text-primary); }

        .status-button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .status-choice-btn { background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-secondary); padding: 10px 8px; border-radius: 8px; font-size: 0.84rem; cursor: pointer; text-align: center; }
        .status-choice-btn.selected[data-status="read"] { background: var(--status-read-bg); color: var(--status-read-text); border-color: var(--status-read-text); font-weight: 600; }
        .status-choice-btn.selected[data-status="reading"] { background: var(--status-reading-bg); color: var(--status-reading-text); border-color: var(--status-reading-text); font-weight: 600; }
        .status-choice-btn.selected[data-status="reread"] { background: var(--status-reread-bg); color: var(--status-reread-text); border-color: var(--status-reread-text); font-weight: 600; }
        .status-choice-btn.selected[data-status="plan"] { background: var(--status-plan-bg); color: var(--status-plan-text); border-color: var(--status-plan-text); font-weight: 600; }

        .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
        .right-actions { display: flex; gap: 8px; margin-left: auto; }
        .btn { padding: 9px 16px; border-radius: 8px; font-size: 0.88rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border); }
        .btn-danger { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <h1>NeuLibrar</h1>
            <p>Eylüm 2025'ten bugüne kişisel okuma arşivi</p>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openBackupModal()">Yedek</button>
            <button class="icon-btn" onclick="toggleTheme()">Açık/Koyu</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card active" id="stat-all" onclick="setFilter('all')">
            <span class="stat-num" id="count-all">0</span>
            <span class="stat-label">Toplam Eser</span>
        </div>
        <div class="stat-card" id="stat-read" onclick="setFilter('read')">
            <span class="stat-num" id="count-read">0</span>
            <span class="stat-label">Okundu</span>
        </div>
        <div class="stat-card" id="stat-reading" onclick="setFilter('reading')">
            <span class="stat-num" id="count-reading">0</span>
            <span class="stat-label">Okunuyor</span>
        </div>
        <div class="stat-card" id="stat-reread" onclick="setFilter('reread')">
            <span class="stat-num" id="count-reread">0</span>
            <span class="stat-label">Yeniden Okunan</span>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Eser adı, yazar veya not ara..." oninput="renderBooks()">
    </div>

    <div class="sort-scroll-container">
        <button class="sort-chip active" id="sort-no-asc" onclick="setSort('no-asc')">№ 1 → 99</button>
        <button class="sort-chip" id="sort-no-desc" onclick="setSort('no-desc')">№ 99 → 1</button>
        <button class="sort-chip" id="sort-title-asc" onclick="setSort('title-asc')">Eser (A → Z)</button>
        <button class="sort-chip" id="sort-author-asc" onclick="setSort('author-asc')">Yazar (A → Z)</button>
    </div>

    <div class="book-list" id="bookList"></div>
</div>

<button class="fab" onclick="openBookModal()">+ Kitap Ekle</button>

<!-- Modal -->
<div class="modal-overlay" id="bookModal">
    <div class="modal">
        <h2 id="modalTitle">Kitap Bilgisi</h2>
        <input type="hidden" id="bookId">
        <div class="form-group">
            <label>Sıra №</label>
            <input type="number" id="bookNo" min="1">
        </div>
        <div class="form-group">
            <label>Eser Adı</label>
            <input type="text" id="bookTitle" placeholder="Örn: Sputnik Sevgilim">
        </div>
        <div class="form-group">
            <label>Yazar Adı</label>
            <input type="text" id="bookAuthor" placeholder="Örn: Haruki Murakami">
        </div>
        
        <!-- Yeniden Okuma Sayacı Kutusu -->
        <div class="reread-box" id="rereadSection" style="display:none;">
            <div>
                <span class="reread-count-text" id="readCountLabel">Okuma Sayısı: 1</span>
                <p style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">Bu eseri kaç kez okudun?</p>
            </div>
            <button type="button" class="btn btn-secondary" style="font-size:0.8rem; padding:6px 10px;" onclick="incrementReadCount()">+1 Tekrar Okudum</button>
        </div>

        <div class="form-group">
            <label>Durum Seç</label>
            <input type="hidden" id="bookStatus" value="read">
            <div class="status-button-grid">
                <button type="button" class="status-choice-btn selected" data-status="read" onclick="selectStatus('read')">✓ Okundu</button>
                <button type="button" class="status-choice-btn" data-status="reading" onclick="selectStatus('reading')">📖 Okunuyor</button>
                <button type="button" class="status-choice-btn" data-status="reread" onclick="selectStatus('reread')">🔄 Yeniden</button>
                <button type="button" class="status-choice-btn" data-status="plan" onclick="selectStatus('plan')">📌 Okunacak</button>
            </div>
        </div>
        <div class="form-group">
            <label>Notlar (İsteğe bağlı)</label>
            <textarea id="bookNotes" placeholder="Çevirmen notu, okuma tarihi veya kısa düşünce..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-danger" id="deleteBtn" style="display:none;" onclick="deleteBook()">Sil</button>
            <div class="right-actions">
                <button class="btn btn-secondary" onclick="closeBookModal()">İptal</button>
                <button class="btn btn-primary" onclick="saveBook()">Kaydet</button>
            </div>
        </div>
    </div>
</div>

<!-- Yedek Modal -->
<div class="modal-overlay" id="backupModal">
    <div class="modal">
        <h2>Veri Yedekleme & Aktarım</h2>
        <p style="font-size:0.82rem; color:var(--text-secondary); margin-bottom:14px;">Verilerini kopyalayıp güvenli bir yere yapıştırabilirsin.</p>
        <div style="display:flex; flex-direction:column; gap:9px;">
            <button class="btn btn-primary" onclick="copyBackupToClipboard()">📋 Yedeği Panoya Kopyala</button>
            <button class="btn btn-secondary" onclick="openRestoreArea()">📥 Metin Yapıştırarak Geri Yükle</button>
            
            <div id="restoreArea" style="display:none; flex-direction:column; gap:8px; margin-top:6px; background:var(--bg-tertiary); padding:10px; border-radius:8px;">
                <textarea id="restoreText" style="width:100%; height:80px; background:var(--bg-primary); color:var(--text-primary); border:1px solid var(--border); border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:0.75rem; padding:6px;"></textarea>
                <button class="btn btn-primary" style="font-size:0.8rem; padding:6px 12px;" onclick="restoreFromText()">Uygula ve Geri Yükle</button>
            </div>
        </div>
        <div class="modal-actions" style="margin-top:16px;">
            <button class="btn btn-secondary" onclick="closeBackupModal()">Kapat</button>
        </div>
    </div>
</div>

<script>
    const INITIAL_BOOKS = [
        { id: 1, no: 1, title: "Ütopya", author: "Thomas More", status: "read", readCount: 1, notes: "" },
        { id: 2, no: 2, title: "Sherlock Holmes: Dörtlerin İmzası", author: "Arthur Conan Doyle", status: "read", readCount: 1, notes: "" },
        { id: 3, no: 3, title: "Dönüşüm", author: "Franz Kafka", status: "read", readCount: 1, notes: "Eylüm 2025 — Okuma serüveninin başlangıcı" },
        { id: 4, no: 4, title: "Bir Köpeğin Araştırması", author: "Franz Kafka", status: "read", readCount: 1, notes: "" },
        { id: 5, no: 5, title: "Yabancı", author: "Albert Camus", status: "read", readCount: 1, notes: "" },
        { id: 6, no: 6, title: "Tersi ve Yüzü", author: "Albert Camus", status: "read", readCount: 1, notes: "" },
        { id: 7, no: 7, title: "Düşüş", author: "Albert Camus", status: "read", readCount: 1, notes: "" },
        { id: 8, no: 8, title: "Sürgün ve Krallık", author: "Albert Camus", status: "read", readCount: 1, notes: "" },
        { id: 9, no: 9, title: "Sisifos Söyleni", author: "Albert Camus", status: "reread", readCount: 1, notes: "Yeniden okunacak" },
        { id: 10, no: 10, title: "Veba", author: "Albert Camus", status: "read", readCount: 1, notes: "" },
        { id: 11, no: 11, title: "Başkaldıran İnsan", author: "Albert Camus", status: "reread", readCount: 1, notes: "Yeniden okunacak" },
        { id: 12, no: 12, title: "Albert Camus ve Başkaldırma Edebiyatı", author: "John Cruickshank", status: "reading", readCount: 1, notes: "Yarısına kadar okundu" },
        { id: 13, no: 13, title: "Tanrı'yı Gören Köpek", author: "Dino Buzzati", status: "read", readCount: 1, notes: "" },
        { id: 14, no: 14, title: "Dava", author: "Franz Kafka", status: "read", readCount: 1, notes: "" },
        { id: 15, no: 15, title: "Şato", author: "Franz Kafka", status: "read", readCount: 1, notes: "" },
        { id: 16, no: 16, title: "Tatar Çölü", author: "Dino Buzzati", status: "read", readCount: 1, notes: "" },
        { id: 17, no: 17, title: "Amerika", author: "Franz Kafka", status: "read", readCount: 1, notes: "" },
        { id: 18, no: 18, title: "Görünmez Kentler", author: "Italo Calvino", status: "read", readCount: 1, notes: "" },
        { id: 19, no: 19, title: "Beyaz Geceler", author: "Fyodor Dostoyevski", status: "read", readCount: 1, notes: "" },
        { id: 20, no: 20, title: "Kâtip Bartleby", author: "Herman Melville", status: "read", readCount: 1, notes: "" },
        { id: 21, no: 21, title: "Bir Delinin Hatıra Defteri", author: "Nikolay Gogol", status: "read", readCount: 1, notes: "" },
        { id: 22, no: 22, title: "Öteki", author: "Fyodor Dostoyevski", status: "read", readCount: 1, notes: "" },
        { id: 23, no: 23, title: "Biz", author: "Yevgeni Zamyatin", status: "read", readCount: 1, notes: "" },
        { id: 24, no: 24, title: "Cesur Yeni Dünya", author: "Aldous Huxley", status: "read", readCount: 1, notes: "" },
        { id: 25, no: 25, title: "Çağdaş Bir Ütopya", author: "H.G. Wells", status: "read", readCount: 1, notes: "" },
        { id: 26, no: 26, title: "Kum Adam", author: "E.T.A. Hoffmann", status: "read", readCount: 1, notes: "" },
        { id: 27, no: 27, title: "Ficciones", author: "Jorge Luis Borges", status: "read", readCount: 1, notes: "" },
        { id: 28, no: 28, title: "Hafıza Polisi", author: "Yōko Ogawa", status: "read", readCount: 1, notes: "" },
        { id: 29, no: 29, title: "Kutu Adam", author: "Kōbō Abe", status: "read", readCount: 1, notes: "" },
        { id: 30, no: 30, title: "Rüyanın Öte Yakası", author: "Ursula K. Le Guin", status: "read", readCount: 1, notes: "" },
        { id: 31, no: 31, title: "Geliş", author: "Ted Chiang", status: "read", readCount: 1, notes: "" },
        { id: 32, no: 32, title: "Mars Yıllıkları", author: "Ray Bradbury", status: "read", readCount: 1, notes: "" },
        { id: 33, no: 33, title: "Siddhartha", author: "Hermann Hesse", status: "read", readCount: 1, notes: "" },
        { id: 34, no: 34, title: "Morel'in Buluşu", author: "Adolfo Bioy Casares", status: "read", readCount: 1, notes: "" },
        { id: 35, no: 35, title: "Karanlıktan Sonra", author: "Haruki Murakami", status: "read", readCount: 1, notes: "" },
        { id: 36, no: 36, title: "Sputnik Sevgilim", author: "Haruki Murakami", status: "read", readCount: 1, notes: "" },
        { id: 37, no: 37, title: "Haşlanmış Harikalar Diyarı ve Dünyanın Sonu", author: "Haruki Murakami", status: "read", readCount: 1, notes: "" },
        { id: 38, no: 38, title: "Profesör ve Hizmetçi", author: "Yōko Ogawa", status: "read", readCount: 1, notes: "" },
        { id: 39, no: 39, title: "Bir Kutup Ayısının Anıları", author: "Yoko Tawada", status: "read", readCount: 1, notes: "" },
        { id: 40, no: 40, title: "Sür Pulluğunu Kemiklerin Üzerinde", author: "Olga Tokarczuk", status: "read", readCount: 1, notes: "" },
        { id: 41, no: 41, title: "UBIK", author: "Philip K. Dick", status: "reading", readCount: 1, notes: "" },
        { id: 42, no: 42, title: "Tanrı Olmak İsteyen Otobüs Şoförü", author: "Etgar Keret", status: "plan", readCount: 1, notes: "" }
    ];

    const STORAGE_KEY = "kisisel_kitaplik_v1";
    let books = [];
    let currentFilter = "all";
    let currentSort = "no-asc";
    let editingReadCount = 1;

    function init() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                books = JSON.parse(saved);
                books.forEach(b => { if (!b.readCount) b.readCount = 1; });
            } catch (e) { books = [...INITIAL_BOOKS]; }
        } else {
            books = [...INITIAL_BOOKS];
            saveToStorage();
        }
        renderBooks();
    }

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
        updateStats();
    }

    function updateStats() {
        document.getElementById("count-all").textContent = books.length;
        document.getElementById("count-read").textContent = books.filter(b => b.status === "read").length;
        document.getElementById("count-reading").textContent = books.filter(b => b.status === "reading").length;
        document.getElementById("count-reread").textContent = books.filter(b => b.readCount > 1 || b.status === "reread").length;
    }

    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll(".stat-card").forEach(el => el.classList.remove("active"));
        document.getElementById("stat-" + filter).classList.add("active");
        renderBooks();
    }

    function setSort(sortKey) {
        currentSort = sortKey;
        document.querySelectorAll(".sort-chip").forEach(el => el.classList.remove("active"));
        const target = document.getElementById("sort-" + sortKey);
        if (target) target.classList.add("active");
        renderBooks();
    }

    function selectStatus(status) {
        document.getElementById("bookStatus").value = status;
        document.querySelectorAll(".status-choice-btn").forEach(btn => {
            if (btn.getAttribute("data-status") === status) btn.classList.add("selected");
            else btn.classList.remove("selected");
        });
    }

    function quickCycleStatus(e, bookId) {
        e.stopPropagation();
        const cycle = ["reading", "read", "reread", "plan"];
        const book = books.find(b => b.id === bookId);
        if (!book) return;
        const nextIdx = (cycle.indexOf(book.status) + 1) % cycle.length;
        book.status = cycle[nextIdx];
        saveToStorage();
        renderBooks();
    }

    function renderBooks() {
        updateStats();
        const query = document.getElementById("searchInput").value.toLowerCase().trim();
        const listEl = document.getElementById("bookList");

        let filtered = books.filter(b => {
            if (currentFilter === "read" && b.status !== "read") return false;
            if (currentFilter === "reading" && b.status !== "reading") return false;
            if (currentFilter === "reread" && (b.readCount <= 1 && b.status !== "reread")) return false;

            if (!query) return true;
            return (
                b.title.toLowerCase().includes(query) ||
                b.author.toLowerCase().includes(query) ||
                (b.notes && b.notes.toLowerCase().includes(query)) ||
                String(b.no).includes(query)
            );
        });

        filtered.sort((a, b) => {
            if (currentSort === "no-asc") return a.no - b.no;
            if (currentSort === "no-desc") return b.no - a.no;
            if (currentSort === "title-asc") return a.title.localeCompare(b.title, 'tr');
            if (currentSort === "author-asc") return a.author.localeCompare(b.author, 'tr');
            return 0;
        });

        if (filtered.length === 0) {
            listEl.innerHTML = '<div class="empty-state">Eşleşen kitap bulunamadı.</div>';
            return;
        }

        listEl.innerHTML = filtered.map(b => {
            let statusLabel = "✓ Okundu";
            let statusClass = "badge-read";
            if (b.status === "reading") { statusLabel = "📖 Okunuyor"; statusClass = "badge-reading"; }
            else if (b.status === "reread") { statusLabel = "🔄 Yeniden"; statusClass = "badge-reread"; }
            else if (b.status === "plan") { statusLabel = "📌 Okunacak"; statusClass = "badge-plan"; }

            const rereadBadge = (b.readCount && b.readCount > 1) 
                ? `<span class="badge badge-count" title="${b.readCount} Kez Okundu">🔄 ${b.readCount}x</span>` 
                : '';

            return `
                <div class="book-item" onclick="openBookModal(${b.id})">
                    <div class="book-no">${b.no}</div>
                    <div class="book-info">
                        <div class="book-title">${escapeHtml(b.title)}</div>
                        <div class="book-author">${escapeHtml(b.author)}</div>
                        ${b.notes ? `<div class="book-note">${escapeHtml(b.notes)}</div>` : ''}
                    </div>
                    <div class="badges-container">
                        ${rereadBadge}
                        <span class="badge ${statusClass}" onclick="quickCycleStatus(event, ${b.id})">${statusLabel}</span>
                    </div>
                </div>
            `;
        }).join("");
    }

    function openBookModal(id = null) {
        const modal = document.getElementById("bookModal");
        const deleteBtn = document.getElementById("deleteBtn");
        const rereadSection = document.getElementById("rereadSection");

        if (id) {
            const book = books.find(b => b.id === id);
            if (!book) return;
            document.getElementById("modalTitle").textContent = "Kitabı Düzenle";
            document.getElementById("bookId").value = book.id;
            document.getElementById("bookNo").value = book.no;
            document.getElementById("bookTitle").value = book.title;
            document.getElementById("bookAuthor").value = book.author;
            selectStatus(book.status || "read");
            document.getElementById("bookNotes").value = book.notes || "";
            
            editingReadCount = book.readCount || 1;
            document.getElementById("readCountLabel").textContent = `Okuma Sayısı: ${editingReadCount}`;
            rereadSection.style.display = "flex";
            deleteBtn.style.display = "block";
        } else {
            const nextNo = books.length > 0 ? Math.max(...books.map(b => b.no)) + 1 : 1;
            document.getElementById("modalTitle").textContent = "Yeni Kitap Ekle";
            document.getElementById("bookId").value = "";
            document.getElementById("bookNo").value = nextNo;
            document.getElementById("bookTitle").value = "";
            document.getElementById("bookAuthor").value = "";
            selectStatus("reading");
            document.getElementById("bookNotes").value = "";
            editingReadCount = 1;
            rereadSection.style.display = "none";
            deleteBtn.style.display = "none";
        }
        modal.classList.add("open");
    }

    function incrementReadCount() {
        editingReadCount += 1;
        document.getElementById("readCountLabel").textContent = `Okuma Sayısı: ${editingReadCount}`;
    }

    function closeBookModal() {
        document.getElementById("bookModal").classList.remove("open");
    }

    function saveBook() {
        const idVal = document.getElementById("bookId").value;
        const no = parseInt(document.getElementById("bookNo").value) || (books.length + 1);
        const title = document.getElementById("bookTitle").value.trim();
        const author = document.getElementById("bookAuthor").value.trim();
        const status = document.getElementById("bookStatus").value;
        const notes = document.getElementById("bookNotes").value.trim();

        if (!title) { alert("Lütfen eser adını gir."); return; }

        if (idVal) {
            const idx = books.findIndex(b => b.id === parseInt(idVal));
            if (idx > -1) {
                books[idx] = { ...books[idx], no, title, author: author || "Bilinmiyor", status, notes, readCount: editingReadCount };
            }
        } else {
            books.push({ id: Date.now(), no, title, author: author || "Bilinmiyor", status, notes, readCount: 1 });
        }

        saveToStorage();
        renderBooks();
        closeBookModal();
    }

    function deleteBook() {
        const idVal = parseInt(document.getElementById("bookId").value);
        if (idVal && confirm("Bu kitabı silmek istediğine emin misin?")) {
            books = books.filter(b => b.id !== idVal);
            saveToStorage();
            renderBooks();
            closeBookModal();
        }
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute("data-theme");
        if (current === "light") {
            document.documentElement.removeAttribute("data-theme");
        } else {
            document.documentElement.setAttribute("data-theme", "light");
        }
    }

    function openBackupModal() { document.getElementById("backupModal").classList.add("open"); }
    function closeBackupModal() { document.getElementById("backupModal").classList.remove("open"); }

    function copyBackupToClipboard() {
        const dataStr = JSON.stringify(books, null, 2);
        navigator.clipboard.writeText(dataStr).then(() => alert("Kütüphane yedeğin panoya kopyalandı!"));
    }

    function openRestoreArea() {
        const area = document.getElementById("restoreArea");
        area.style.display = area.style.display === "none" ? "flex" : "none";
    }

    function restoreFromText() {
        const text = document.getElementById("restoreText").value.trim();
        try {
            const imported = JSON.parse(text);
            if (Array.isArray(imported)) {
                books = imported;
                saveToStorage();
                renderBooks();
                closeBackupModal();
                alert("Geri yüklendi!");
            }
        } catch (e) { alert("Geçersiz veri."); }
    }

    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : ""; }

    init();
</script>
</body>
</html>
