<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0e11">
    <title>NeuLibrar</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d0e11;
            --bg-glass: rgba(22, 24, 29, 0.65);
            --bg-glass-hover: rgba(30, 33, 40, 0.75);
            --bg-modal: rgba(18, 20, 24, 0.85);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-shine: rgba(255, 255, 255, 0.15);
            --gloss-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 100%);
            --danger: #ef4444;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-glass-hover: rgba(255, 255, 255, 0.85);
            --bg-modal: rgba(255, 255, 255, 0.9);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-glass: rgba(0, 0, 0, 0.08);
            --border-glass-shine: rgba(0, 0, 0, 0.15);
            --gloss-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 95px;
            user-select: none;
            background-image: 
                radial-gradient(at 20% 20%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container { max-width: 920px; margin: 0 auto; padding: 20px 16px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand h1 {
            font-size: 1.45rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.02em;
        }

        .version-tag {
            font-size: 0.68rem;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 2px 7px;
            border-radius: 20px;
        }

        .brand p { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }

        .header-actions { display: flex; gap: 8px; }

        /* Glassmorphic Liquid Buttons */
        .icon-btn {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .icon-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gloss-shine);
            pointer-events: none;
        }

        .icon-btn:active { transform: scale(0.95); }

        /* 5-Column Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 10px 6px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gloss-shine);
            pointer-events: none;
        }

        .stat-card.active {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.12);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .stat-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            display: block;
        }

        .stat-label { font-size: 0.68rem; color: var(--text-secondary); margin-top: 2px; display: block; white-space: nowrap; }

        /* Search Box */
        .search-box { margin-bottom: 14px; }
        .search-box input {
            width: 100%;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: rgba(99, 102, 241, 0.6); }

        /* Sort Pills */
        .sort-scroll-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
        .sort-chip {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sort-chip.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        /* Book List & Glass Items */
        .book-list { display: flex; flex-direction: column; gap: 10px; }

        .book-item {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 13px 16px;
            display: grid;
            grid-template-columns: 38px 1fr auto;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.2s;
        }

        .book-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gloss-shine);
            pointer-events: none;
        }

        .book-item:active { transform: scale(0.98); }

        .book-no {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            padding: 5px 6px;
            border-radius: 8px;
        }

        .book-title { font-weight: 600; font-size: 0.96rem; color: var(--text-primary); }
        .book-author { font-size: 0.82rem; color: var(--text-secondary); margin-top: 1px; }
        .book-note {
            font-size: 0.76rem;
            color: #fcd34d;
            margin-top: 5px;
            padding: 3px 9px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 6px;
            display: inline-block;
        }

        /* Liquid Glass Frutiger Aero Badges */
        .badges-container { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
            border: 1px solid transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        /* Okundu - Zümrüt Yeşili */
        .badge-read {
            background: rgba(16, 185, 129, 0.16);
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.35);
        }

        /* Okunuyor - Okyanus Mavisi */
        .badge-reading {
            background: rgba(14, 165, 233, 0.16);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.35);
        }

        /* Tekrar Okunuyor / xN Tekrar - Fıstık Yeşili Parlak Cam */
        .badge-reread-count {
            background: rgba(132, 204, 22, 0.18);
            color: #a3e635;
            border-color: rgba(163, 230, 53, 0.4);
        }

        /* Yeniden / Plan - Macenta / Mor-Kırmızı */
        .badge-reread {
            background: rgba(217, 70, 239, 0.16);
            color: #f0abfc;
            border-color: rgba(240, 171, 252, 0.35);
        }

        /* Okunacak - Mercan Kırmızısı */
        .badge-plan {
            background: rgba(249, 115, 22, 0.16);
            color: #fb923c;
            border-color: rgba(251, 146, 60, 0.35);
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent-gradient);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 14px 22px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
            z-index: 50;
            transition: transform 0.15s;
        }
        .fab:active { transform: scale(0.94); }

        /* Modal Pencereleri */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--bg-modal);
            border: 1px solid var(--border-glass-shine);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 { font-size: 1.15rem; margin-bottom: 18px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        /* İnteraktif Tekrar Okuma Sayacı Kutusu */
        .reread-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reread-counter-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
        }

        .counter-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-btn:active { transform: scale(0.9); }

        .counter-num {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.95rem;
            color: #a3e635;
            min-width: 20px;
            text-align: center;
        }

        /* Status Grid */
        .status-button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .status-choice-btn {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            padding: 10px 8px;
            border-radius: 10px;
            font-size: 0.84rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .status-choice-btn.selected[data-status="read"] { background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: #34d399; font-weight: 600; }
        .status-choice-btn.selected[data-status="reading"] { background: rgba(14, 165, 233, 0.2); color: #38bdf8; border-color: #38bdf8; font-weight: 600; }
        .status-choice-btn.selected[data-status="reread"] { background: rgba(217, 70, 239, 0.2); color: #f0abfc; border-color: #f0abfc; font-weight: 600; }
        .status-choice-btn.selected[data-status="plan"] { background: rgba(249, 115, 22, 0.2); color: #fb923c; border-color: #fb923c; font-weight: 600; }

        .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
        .right-actions { display: flex; gap: 8px; margin-left: auto; }
        .btn { padding: 9px 16px; border-radius: 10px; font-size: 0.88rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; }
        .btn-primary { background: var(--accent-gradient); color: #fff; }
        .btn-secondary { background: rgba(255, 255, 255, 0.06); color: var(--text-primary); border-color: var(--border-glass); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem; }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .stat-card:nth-child(4), .stat-card:nth-child(5) { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <h1>NeuLibrar <span class="version-tag">v2.0</span></h1>
            <p>Eylüm 2025'ten bugüne kişisel okuma arşivi</p>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openBackupModal()">Yedek</button>
            <button class="icon-btn" onclick="toggleTheme()">Açık/Koyu</button>
        </div>
    </header>

    <!-- 5'li İstatistik Grid -->
    <div class="stats-grid">
        <div class="stat-card active" id="stat-all" onclick="setFilter('all')">
            <span class="stat-num" id="count-all">0</span>
            <span class="stat-label">Toplam</span>
        </div>
        <div class="stat-card" id="stat-read" onclick="setFilter('read')">
            <span class="stat-num" id="count-read">0</span>
            <span class="stat-label">Okundu</span>
        </div>
        <div class="stat-card" id="stat-reading" onclick="setFilter('reading')">
            <span class="stat-num" id="count-reading">0</span>
            <span class="stat-label">Okunuyor</span>
        </div>
        <div class="stat-card" id="stat-reread" onclick="setFilter('reread')">
            <span class="stat-num" id="count-reread">0</span>
            <span class="stat-label">Tekrar Okunan</span>
        </div>
        <div class="stat-card" id="stat-plan" onclick="setFilter('plan')">
            <span class="stat-num" id="count-plan">0</span>
            <span class="stat-label">Okunacak</span>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Eser adı, yazar veya not ara..." oninput="renderBooks()">
    </div>

    <div class="sort-scroll-container">
        <button class="sort-chip active" id="sort-no-asc" onclick="setSort('no-asc')">№ 1 → 99</button>
        <button class="sort-chip" id="sort-no-desc" onclick="setSort('no-desc')">№ 99 → 1</button>
        <button class="sort-chip" id="sort-title-asc" onclick="setSort('title-asc')">Eser (A → Z)</button>
        <button class="sort-chip" id="sort-author-asc" onclick="setSort('author-asc')">Yazar (A → Z)</button>
    </div>

    <div class="book-list" id="bookList"></div>
</div>

<button class="fab" onclick="openBookModal()">+ Kitap Ekle</button>

<!-- Kitap Ekle/Düzenle Modal -->
<div class="modal-overlay" id="bookModal">
    <div class="modal">
        <h2 id="modalTitle">Kitap Bilgisi</h2>
        <input type="hidden" id="bookId">
        <div class="form-group">
            <label>Sıra №</label>
            <input type="number" id="bookNo" min="1">
        </div>
        <div class="form-group">
            <label>Eser Adı</label>
            <input type="text" id="bookTitle" placeholder="Örn: Sputnik Sevgilim">
        </div>
        <div class="form-group">
            <label>Yazar Adı</label>
            <input type="text" id="bookAuthor" placeholder="Örn: Haruki Murakami">
        </div>
        
        <!-- İnteraktif Tekrar Okuma Kontrol Paneli -->
        <div class="reread-box" id="rereadSection" style="display:none;">
            <div>
                <span style="font-size:0.88rem; font-weight:600;">Tekrar Okunma Seviyesi</span>
                <p style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">Bu eseri kaçıncı kez okuyorsun?</p>
            </div>
            <div class="reread-counter-controls">
                <button type="button" class="counter-btn" onclick="adjustReadCount(-1)">-</button>
                <span class="counter-num" id="readCountLabel">1</span>
                <button type="button" class="counter-btn" onclick="adjustReadCount(1)">+</button>
            </div>
        </div>

        <div class="form-group">
            <label>Durum Seç</label>
            <input type="hidden" id="bookStatus" value="read">
            <div class="status-button-grid">
                <button type="button" class="status-choice-btn selected" data-status="read" onclick="selectStatus('read')">✓ Okundu</button>
                <button type="button" class="status-choice-btn" data-status="reading" onclick="selectStatus('reading')">📖 Okunuyor</button>
                <button type="button" class="status-choice-btn" data-status="reread" onclick="selectStatus('reread')">🔄 Yeniden</button>
                <button type="button" class="status-choice-btn" data-status="plan" onclick="selectStatus('plan')">📌 Okunacak</button>
            </div>
        </div>
        <div class="form-group">
            <label>Notlar (İsteğe bağlı)</label>
            <textarea id="bookNotes" placeholder="Çevirmen notu, okuma tarihi veya düşünce..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-danger" id="deleteBtn" style="display:none;" onclick="deleteBook()">Sil</button>
            <div class="right-actions">
                <button class="btn btn-secondary" onclick="closeBookModal()">İptal</button>
                <button class="btn btn-primary" onclick="saveBook()">Kaydet</button>
            </div>
        </div>
    </div>
</div>

<!-- Yedek Modal -->
<div class="modal-overlay" id="backupModal">
    <div class="modal">
        <h2>Veri Yedekleme & Aktarım</h2>
        <p style="font-size:0.82rem; color:var(--text-secondary); margin-bottom:14px;">Verilerini kopyalayıp güvenli bir yere yapıştırabilirsin.</p>
        <div style="display:flex; flex-direction:column; gap:9px;">
            <button class="btn btn-primary" onclick="copyBackupToClipboard()">📋 Yedeği Panoya Kopyala</button>
            <button class="btn btn-secondary" onclick="openRestoreArea()">📥 Metin Yapıştırarak Geri Yükle</button>
            
            <div id="restoreArea" style="display:none; flex-direction:column; gap:8px; margin-top:6px; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px;">
                <textarea id="restoreText" style="width:100%; height:80px; background:var(--bg-primary); color:var(--text-primary); border:1px solid var(--border-glass); border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:0.75rem; padding:6px;"></textarea>
                <button class="btn btn-primary" style="font-size:0.8rem; padding:6px 12px;" onclick="restoreFromText()">Uygula ve Geri Yükle</button>
            </div>
        </div>
        <div class="modal-actions" style="margin-top:16px;">
            <button class="btn btn-secondary" onclick="closeBackupModal()">Kapat</button>
        </div>
    </div>
</div>

<script>
    const INITIAL_BOOKS = [
        { id: 1, no: 1, title: "Ütopya", author: "Thomas More", status: "read", readCount: 1, notes: "" },
        { id: 2, no: 2, title: "Sherlock Holmes: Dörtlerin İmzası", author: "Arthur Conan Doyle", status: "read", readCount: 1, notes: "" },
        { id: 3, no: 3, title: "Dönüşüm", author: "Franz Kafka", status: "read", readCount: 1, notes: "Eylül 2025 — Okuma serüveninin başlangıcı" },
        { id: 4, no: 4, title: "Bir Köpeğin Araştırması", author: "Franz Kafka", status: "read", readCount: 1, notes: "" },
        { id: 5, no: 5, title: "Yabancı", author: "Albert Camus", status: "read", readCount: 1, notes: "" },
        { id: 6, no: 6, title: "Tersi ve Yüzü", author: "Albert Camus", status: "read", readCount: 1, notes: "" },
        { id: 7, no: 7, title: "Düşüş", author: "Albert Camus", status: "read", readCount: 1, notes: "" },

    const STORAGE_KEY = "kisisel_kitaplik_v1";
    let books = [];
    let currentFilter = "all";
    let currentSort = "no-asc";
    let editingReadCount = 1;

    function init() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                books = JSON.parse(saved);
                books.forEach(b => { if (!b.readCount) b.readCount = 1; });
            } catch (e) { books = [...INITIAL_BOOKS]; }
        } else {
            books = [...INITIAL_BOOKS];
            saveToStorage();
        }
        renderBooks();
    }

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
        updateStats();
    }

    function updateStats() {
        document.getElementById("count-all").textContent = books.length;
        document.getElementById("count-read").textContent = books.filter(b => b.status === "read").length;
        document.getElementById("count-reading").textContent = books.filter(b => b.status === "reading").length;
        document.getElementById("count-reread").textContent = books.filter(b => b.readCount > 1 || b.status === "reread").length;
        document.getElementById("count-plan").textContent = books.filter(b => b.status === "plan").length;
    }

    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll(".stat-card").forEach(el => el.classList.remove("active"));
        document.getElementById("stat-" + filter).classList.add("active");
        renderBooks();
    }

    function setSort(sortKey) {
        currentSort = sortKey;
        document.querySelectorAll(".sort-chip").forEach(el => el.classList.remove("active"));
        const target = document.getElementById("sort-" + sortKey);
        if (target) target.classList.add("active");
        renderBooks();
    }

    function selectStatus(status) {
        document.getElementById("bookStatus").value = status;
        document.querySelectorAll(".status-choice-btn").forEach(btn => {
            if (btn.getAttribute("data-status") === status) btn.classList.add("selected");
            else btn.classList.remove("selected");
        });
    }

    function adjustReadCount(delta) {
        editingReadCount = Math.max(1, editingReadCount + delta);
        document.getElementById("readCountLabel").textContent = editingReadCount;
    }

    function renderBooks() {
        updateStats();
        const query = document.getElementById("searchInput").value.toLowerCase().trim();
        const listEl = document.getElementById("bookList");

        let filtered = books.filter(b => {
            if (currentFilter === "read" && b.status !== "read") return false;
            if (currentFilter === "reading" && b.status !== "reading") return false;
            if (currentFilter === "reread" && (b.readCount <= 1 && b.status !== "reread")) return false;
            if (currentFilter === "plan" && b.status !== "plan") return false;

            if (!query) return true;
            return (
                b.title.toLowerCase().includes(query) ||
                b.author.toLowerCase().includes(query) ||
                (b.notes && b.notes.toLowerCase().includes(query)) ||
                String(b.no).includes(query)
            );
        });

        filtered.sort((a, b) => {
            if (currentSort === "no-asc") return a.no - b.no;
            if (currentSort === "no-desc") return b.no - a.no;
            if (currentSort === "title-asc") return a.title.localeCompare(b.title, 'tr');
            if (currentSort === "author-asc") return a.author.localeCompare(b.author, 'tr');
            return 0;
        });

        if (filtered.length === 0) {
            listEl.innerHTML = '<div class="empty-state">Eşleşen kitap bulunamadı.</div>';
            return;
        }

        listEl.innerHTML = filtered.map(b => {
            let statusLabel = "✓ Okundu";
            let statusClass = "badge-read";
            if (b.status === "reading") { statusLabel = "📖 Okunuyor"; statusClass = "badge-reading"; }
            else if (b.status === "reread") { statusLabel = "🔄 Yeniden"; statusClass = "badge-reread"; }
            else if (b.status === "plan") { statusLabel = "📌 Okunacak"; statusClass = "badge-plan"; }

            // Okundu rozetinin hemen solunda yer alacak fıstık yeşili parlak "Tekrar Okunuyor / Okundu" rozeti
            const rereadBadge = (b.readCount && b.readCount > 1) 
                ? `<span class="badge badge-reread-count" title="${b.readCount} Kez Okundu">🔄 ${b.readCount}x Tekrar</span>` 
                : '';

            return `
                <div class="book-item" onclick="openBookModal(${b.id})">
                    <div class="book-no">${b.no}</div>
                    <div class="book-info">
                        <div class="book-title">${escapeHtml(b.title)}</div>
                        <div class="book-author">${escapeHtml(b.author)}</div>
                        ${b.notes ? `<div class="book-note">${escapeHtml(b.notes)}</div>` : ''}
                    </div>
                    <div class="badges-container">
                        ${rereadBadge}
                        <span class="badge ${statusClass}">${statusLabel}</span>
                    </div>
                </div>
            `;
        }).join("");
    }

    function openBookModal(id = null) {
        const modal = document.getElementById("bookModal");
        const deleteBtn = document.getElementById("deleteBtn");
        const rereadSection = document.getElementById("rereadSection");

        if (id) {
            const book = books.find(b => b.id === id);
            if (!book) return;
            document.getElementById("modalTitle").textContent = "Kitabı Düzenle";
            document.getElementById("bookId").value = book.id;
            document.getElementById("bookNo").value = book.no;
            document.getElementById("bookTitle").value = book.title;
            document.getElementById("bookAuthor").value = book.author;
            selectStatus(book.status || "read");
            document.getElementById("bookNotes").value = book.notes || "";
            
            editingReadCount = book.readCount || 1;
            document.getElementById("readCountLabel").textContent = editingReadCount;
            rereadSection.style.display = "flex";
            deleteBtn.style.display = "block";
        } else {
            const nextNo = books.length > 0 ? Math.max(...books.map(b => b.no)) + 1 : 1;
            document.getElementById("modalTitle").textContent = "Yeni Kitap Ekle";
            document.getElementById("bookId").value = "";
            document.getElementById("bookNo").value = nextNo;
            document.getElementById("bookTitle").value = "";
            document.getElementById("bookAuthor").value = "";
            selectStatus("reading");
            document.getElementById("bookNotes").value = "";
            editingReadCount = 1;
            rereadSection.style.display = "none";
            deleteBtn.style.display = "none";
        }
        modal.classList.add("open");
    }

    function closeBookModal() { document.getElementById("bookModal").classList.remove("open"); }

    function saveBook() {
        const idVal = document.getElementById("bookId").value;
        const no = parseInt(document.getElementById("bookNo").value) || (books.length + 1);
        const title = document.getElementById("bookTitle").value.trim();
        const author = document.getElementById("bookAuthor").value.trim();
        const status = document.getElementById("bookStatus").value;
        const notes = document.getElementById("bookNotes").value.trim();

        if (!title) { alert("Lütfen eser adını gir."); return; }

        if (idVal) {
            const idx = books.findIndex(b => b.id === parseInt(idVal));
            if (idx > -1) {
                books[idx] = { ...books[idx], no, title, author: author || "Bilinmiyor", status, notes, readCount: editingReadCount };
            }
        } else {
            books.push({ id: Date.now(), no, title, author: author || "Bilinmiyor", status, notes, readCount: 1 });
        }

        saveToStorage();
        renderBooks();
        closeBookModal();
    }

    function deleteBook() {
        const idVal = parseInt(document.getElementById("bookId").value);
        if (idVal && confirm("Bu kitabı silmek istediğine emin misin?")) {
            books = books.filter(b => b.id !== idVal);
            saveToStorage();
            renderBooks();
            closeBookModal();
        }
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute("data-theme");
        if (current === "light") {
            document.documentElement.removeAttribute("data-theme");
        } else {
            document.documentElement.setAttribute("data-theme", "light");
        }
    }

    function openBackupModal() { document.getElementById("backupModal").classList.add("open"); }
    function closeBackupModal() { document.getElementById("backupModal").classList.remove("open"); }

    function copyBackupToClipboard() {
        const dataStr = JSON.stringify(books, null, 2);
        navigator.clipboard.writeText(dataStr).then(() => alert("Kütüphane yedeğin panoya kopyalandı!"));
    }

    function openRestoreArea() {
        const area = document.getElementById("restoreArea");
        area.style.display = area.style.display === "none" ? "flex" : "none";
    }

    function restoreFromText() {
        const text = document.getElementById("restoreText").value.trim();
        try {
            const imported = JSON.parse(text);
            if (Array.isArray(imported)) {
                books = imported;
                saveToStorage();
                renderBooks();
                closeBackupModal();
                alert("Geri yüklendi!");
            }
        } catch (e) { alert("Geçersiz veri."); }
    }

    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : ""; }

    init();
</script>
